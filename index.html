<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">

    <title>Simple Modal Creator</title>

</head>

<body>

    <h1>Simple Modal Creator</h1>
    <p>Create your own modal and generate html/css/js</p>

    <main>

        <form id="modalForm">
            <div class="input-group">
                <label class="input-group-label" for="modalWidth">Width</label>
                <input class="input-group-item" type="number" name="modalWidth" id="modalWidth">
            </div>
            <div class="input-group">
                <label class="input-group-label" for="modalHeight">Height</label>
                <input class="input-group-item" type="number" name="modalHeight" id="modalHeight">
            </div>
            <div class="input-group">
                <label class="input-group-label" for="modalBackgroundColor">Background</label>
                <input class="input-group-item" type="color" name="modalBackgroundColor" id="modalBackgroundColor" value="#ffffff">
            </div>
            <div class="input-group">
                <label class="input-group-label" for="modalBackdropColor">Backdrop</label>
                <input class="input-group-item" type="color" name="modalBackdropColor" id="modalBackdropColor" value="#000000">
            </div>
            <div class="input-group">
                <label class="input-group-label" for="modalAnimation">Animation</label>
                <select class="input-group-item" name="modalAnimation" id="modalAnimation">
                    <option value="default">Default</option>
                    <option value="none">None</option>
                    <option value="default">XX</option>
                    <option value="default">XX</option>
                </select>
            </div>
            <div class="input-group">
                <label class="input-group-label" for="modalStyle">Style</label>
                <select class="input-group-item" name="modalStyle" id="modalStyle">
                    <option value="default">Default</option>
                    <option value="none">None</option>
                    <option value="default">XX</option>
                    <option value="default">XX</option>
                </select>
            </div>
            <div class="input-group">
                <label class="input-group-label" for="modalTitle">Title</label>
                <input class="input-group-item" type="text" name="modalTitle" id="modalTitle">
            </div>
            <div class="input-group">
                <label class="input-group-label" for="modalColor">Color</label>
                <input class="input-group-item" type="color" name="modalColor" id="modalColor">
            </div>
            <div class="input-group">
                <label class="input-group-label" for="modalOk">Ok Button</label>
                <select class="input-group-item" name="modalOk" id="modalOk">
                    <option value="default">Default</option>
                    <option value="none">None</option>
                </select>
            </div>
            <div class="input-group">
                <label class="input-group-label" for="modalClosing">Closing Button</label>
                <select class="input-group-item" name="modalClosing" id="modalClosing">
                    <option value="default">Top + Bottom</option>
                    <option value="none">Only Top</option>
                    <option value="default">Only Bottom</option>
                    <option value="default">None</option>
                </select>
            </div>
        </form>

        <div id="preview">
            <div id="modalPreview" class="modal">
                <header class="modal-header">
                    <h3>Title</h3>
                    <button id="modalCloseBtn"></button>
                </header>
                <section class="modal-body">
                    Lorem Ipsum
                </section>
                <footer class="modal-footer">
                    <button id="modalCancelBtn">Cancel</button>
                    <button id="modalOkBtn">Ok</button>
                </footer>
            </div>
            <div id="modalBackdrop" class="modal-backdrop"></div>
        </div>

        <button id="generateCode">Generate Code <img src="./img/chemistry-icon.svg"></button>

    </main>

    <script src="./script.js"></script>

</body>

</html>
